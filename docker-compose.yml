services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kinetic
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kinetic"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend

  kinetic-backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
      args:
        NODE_ENV: production

    depends_on:
      postgres:
        condition: service_healthy

    # Environment variables
    environment:
      NODE_ENV: production
      PORT: 4242
      LOG_LEVEL: info
      # Database configuration (managed Postgres container above)
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/kinetic

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M

    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4242/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # Restart policy
    restart: unless-stopped

    # Network configuration
    networks:
      - backend

volumes:
  db_data:
    driver: local

networks:
  backend:
    driver: bridge
