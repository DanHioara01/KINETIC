services:
  kinetic-backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
      args:
        NODE_ENV: production
    
    # Persistent storage configuration
    volumes:
      - ./shared-data/db:/app/shared-data/db
      - ./logs:/app/logs
    
    # Environment variables
    environment:
      NODE_ENV: production
      PORT: 4242
      LOG_LEVEL: info
      # Database configuration
      DB_PATH: /app/shared-data/db/kinetic.db
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.8'
          memory: 512M
        reservations:
          cpus: '0.2'
          memory: 128M
    
    # Health check configuration
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4242/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    # Restart policy
    restart: unless-stopped
    
    # Network configuration
    networks:
      - backend

volumes:
  db_data:
    driver: local
  logs_data:
    driver: local

networks:
  backend:
    driver: bridge