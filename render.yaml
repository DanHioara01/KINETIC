databases:
  - name: kinetic-db
    databaseName: kinetic
    user: kinetic
    plan: free

services:
  - type: web
    name: kinetic-ai-trainer
    runtime: docker
    dockerfilePath: ./ai_server/Dockerfile
    envVars:
      - key: PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: API_KEY
        sync: false
      - key: MODEL
        value: llama-3.1-8b-instant
      - key: MAX_MESSAGE_LENGTH
        value: "4000"
      - key: CACHE_TTL_SECONDS
        value: "3600"

  - type: web
    name: kinetic-backend
    runtime: docker
    dockerfilePath: ./Dockerfile.backend
    envVars:
      - key: PORT
        value: "4242"
      - key: DATABASE_URL
        fromDatabase:
          name: kinetic-db
          property: connectionString
